[package]
name = "ultra-downloader"
version = "0.2.3"
description = "High-performance Multi-threaded Dynamic Downloader inspired by IDM"
authors = ["Brayan Salazar <brayan@example.com>"]
edition = "2021"
default-run = "ultra-downloader"

[lib]
name = "ultra_downloader_lib"
crate-type = ["rlib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "tray-icon", "image-png", "image-ico", "compression", "dynamic-acl"] }
tauri-plugin-opener = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "cookies", "gzip", "brotli"] }
futures-util = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1.0"
tracing = "0.1"
url = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
base64 = "0.23.1"
rfd = "0.17.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
rust-ini = "=0.21.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
