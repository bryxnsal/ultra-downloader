<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo degrade sutil -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b121e" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>

    <!-- Gradiente Cyan brillante para el rayo y flecha de aceleración Ultra Downloader -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gradiente de los 3 streams de conexión IDM -->
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Resplandor cibernético / futurista -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Contenedor Base redondeado tipo App Icon moderna -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6" />

  <!-- Acento angular de fondo (estilo IDM / Turbo) -->
  <path d="M 80 140 L 432 140 L 372 372 L 80 372 Z" fill="#0369a1" opacity="0.08" />

  <!-- Símbolo de Streams de datos multi-hilo en paralelo (3 líneas de transferencia rápida) -->
  <g opacity="0.85">
    <line x1="130" y1="125" x2="382" y2="125" stroke="url(#streamGrad)" stroke-width="12" stroke-linecap="round" />
    <line x1="170" y1="155" x2="342" y2="155" stroke="url(#streamGrad)" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Flecha de Descarga de Alto Rendimiento estilizada con corte dinámico 'B' -->
  <!-- Vértice superior y cuerpo de flecha penetrante -->
  <path d="M 256 185
           L 365 295
           L 305 295
           L 305 375
           L 207 375
           L 207 295
           L 147 295
           Z"
        fill="url(#cyanGrad)"
        filter="url(#neonGlow)" />

  <!-- Rayo de ultra velocidad centrado en el núcleo de descarga -->
  <path d="M 268 205
           L 225 285
           L 260 285
           L 242 355
           L 288 275
           L 254 275
           Z"
        fill="#f8fafc"
        filter="url(#subtleGlow)" />

  <!-- Disco receptor / Base de destino de datos (Bandeja con segmentos de Chunks) -->
  <g>
    <!-- Segmento Izquierdo Chunk 1 -->
    <rect x="110" y="405" width="80" height="22" rx="6" fill="#38bdf8" />
    <!-- Segmento Central Chunk 2 -->
    <rect x="202" y="405" width="108" height="22" rx="6" fill="#0284c7" />
    <!-- Segmento Derecho Chunk 3 -->
    <rect x="322" y="405" width="80" height="22" rx="6" fill="#38bdf8" />
  </g>
</svg>
