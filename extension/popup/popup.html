<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultra Downloader</title>
  <style>
    :root {
      --bg-primary: #000000;
      --bg-secondary: #0d0d0d;
      --bg-surface: #141414;
      --bg-hover: #1f1f1f;
      --border: #262626;
      --text-main: #f5f5f5;
      --text-muted: #888888;
      --accent: #22c55e;
      --accent-muted: #14532d;
    }

    [data-color-mode="light"] {
      --bg-primary: #ffffff;
      --bg-secondary: #f1f5f9;
      --bg-surface: #f8fafc;
      --bg-hover: #e2e8f0;
      --border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #16a34a;
      --accent-muted: #86efac;
    }

    [data-theme="amber"] {
      --accent: #f59e0b;
      --accent-muted: #78350f;
    }
    [data-color-mode="light"][data-theme="amber"] {
      --accent: #d97706;
      --accent-muted: #fde68a;
    }

    [data-theme="cyan"] {
      --accent: #06b6d4;
      --accent-muted: #164e63;
    }
    [data-color-mode="light"][data-theme="cyan"] {
      --accent: #0284c7;
      --accent-muted: #bae6fd;
    }

    [data-theme="dracula"] {
      --bg-primary: #1e1f29;
      --bg-secondary: #282a36;
      --bg-surface: #343746;
      --bg-hover: #44475a;
      --border: #44475a;
      --text-main: #f8f8f2;
      --text-muted: #6272a4;
      --accent: #bd93f9;
      --accent-muted: #6272a4;
    }
    [data-color-mode="light"][data-theme="dracula"] {
      --bg-primary: #f5f3ff;
      --bg-secondary: #ede9fe;
      --bg-surface: #ffffff;
      --bg-hover: #ddd6fe;
      --border: #c4b5fd;
      --text-main: #2e1065;
      --text-muted: #6d28d9;
      --accent: #7c3aed;
      --accent-muted: #ddd6fe;
    }

    [data-theme="mono"] {
      --accent: #ffffff;
      --accent-muted: #404040;
    }
    [data-color-mode="light"][data-theme="mono"] {
      --accent: #0f172a;
      --accent-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 310px;
      margin: 0;
      padding: 12px;
      background: var(--bg-primary);
      color: var(--text-main);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 11px;
      user-select: none;
      line-height: 1.3;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .brand-logo-sq {
      width: 10px;
      height: 10px;
      background-color: #ffffff;
      display: inline-block;
      flex-shrink: 0;
      box-shadow: 0 0 2px rgba(255, 255, 255, 0.4);
    }

    .brand-title {
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--text-main);
      font-size: 11px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      font-size: 10px;
      color: var(--text-muted);
    }

    .indicator {
      width: 6px;
      height: 6px;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    .status-text {
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.05em;
    }

    .section-title {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ext-textarea {
      width: 100%;
      height: 56px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px;
      font-family: inherit;
      font-size: 10px;
      resize: vertical;
      margin-bottom: 10px;
      outline: none;
      transition: border-color 0.15s;
    }

    .ext-textarea:focus {
      border-color: var(--accent);
    }

    .theme-select {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 5px 8px;
      font-family: inherit;
      font-size: 10px;
      margin-bottom: 12px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .theme-select:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 7px;
      cursor: pointer;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      transition: all 0.15s;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--bg-hover);
    }

    .save-indicator {
      font-size: 9px;
      color: var(--accent);
      font-weight: 700;
      display: none;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="brand-logo-sq"></span>
      <span class="brand-title">ULTRA DOWNLOADER</span>
    </div>
    <span id="save-msg" class="save-indicator">SAVED ✓</span>
  </div>

  <div class="status">
    <div class="indicator"></div>
    <span id="status-text" class="status-text">SYNCED WITH ULTRA APP</span>
  </div>

  <div class="section-title">
    <span id="ext-label">INTERCEPTED EXTENSIONS</span>
    <span style="color: var(--text-muted); font-size: 8px;">(DESKTOP APP)</span>
  </div>
  <textarea id="extensions-input" class="ext-textarea" readonly style="opacity: 0.85; cursor: default;"></textarea>

  <div class="section-title">
    <span id="theme-label">VIDEO BUTTON COLOR MODE</span>
  </div>
  <select id="theme-select" class="theme-select">
    <option value="same_as_app">MATCH APP COLOR MODE (Auto)</option>
    <option value="matrix">MATRIX (Green)</option>
    <option value="amber">AMBER (Amber)</option>
    <option value="cyan">CYAN (Cyan)</option>
    <option value="dracula">DRACULA (Purple)</option>
    <option value="mono">MONO (High Contrast)</option>
  </select>

  <button id="open-app-btn" class="btn">OPEN ULTRA DOWNLOADER</button>

  <script src="popup.js"></script>
</body>
</html>
